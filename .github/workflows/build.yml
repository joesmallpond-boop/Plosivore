# Builds Plosivore for macOS (VST3 + AU + standalone, universal Intel/Apple Silicon, plus an installer),
# Windows (VST3 + standalone) and Linux (VST3 + standalone) on every push.
# Download the results from the run's "Artifacts" section on GitHub.
# Push a tag like v1.0.0 to also publish them as a GitHub Release.
name: Build Plosivore

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-22.04
            name: Linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxext-dev libxcomposite-dev libfreetype-dev \
            libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        # Apple Silicon only for speed; change arm64 below to "arm64;x86_64" for a universal build that also runs on Intel Macs.
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES=arm64' || '' }}

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if ! cmake --build build --config Release --parallel 6 2>&1 | tee build.log; then
            # Surface compiler errors as annotations so they're readable from the GitHub API
            grep -E "error[: ]|Error [0-9]|fatal error" build.log | grep -v "warning" | sort -u | head -30 | \
              while IFS= read -r line; do echo "::error::${line//%/%25}"; done
            exit 1
          fi

      - name: Sign plugins (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERTS_P12: ${{ secrets.MACOS_CERTS_P12 }}
          MACOS_CERTS_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
          MACOS_DEV_ID_APPLICATION: ${{ secrets.MACOS_DEV_ID_APPLICATION }}
        run: bash Installer/macOS/sign_plugins.sh build/Plosivore_artefacts/Release

      - name: Validate with pluginval
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)   PV=pluginval_macOS.zip;   BIN=pluginval.app/Contents/MacOS/pluginval ;;
            Windows) PV=pluginval_Windows.zip; BIN=pluginval.exe ;;
            Linux)   PV=pluginval_Linux.zip;   BIN=pluginval ;;
          esac
          mkdir -p pv && cd pv
          curl -sSfL -o pv.zip "https://github.com/Tracktion/pluginval/releases/latest/download/$PV"
          cmake -E tar xf pv.zip
          chmod +x "$BIN" || true
          "./$BIN" --strictness-level 10 --validate-in-process --skip-gui-tests \
            ../build/Plosivore_artefacts/Release/VST3/Plosivore.vst3

      - name: Build macOS installer
        if: runner.os == 'macOS'
        env:
          MACOS_DEV_ID_APPLICATION: ${{ secrets.MACOS_DEV_ID_APPLICATION }}
          MACOS_DEV_ID_INSTALLER: ${{ secrets.MACOS_DEV_ID_INSTALLER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash Installer/macOS/build_pkg.sh build/Plosivore_artefacts/Release installer

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: Plosivore-macOS-Installer
          path: installer/*.dmg

      - name: Collect
        shell: bash
        run: |
          R=build/Plosivore_artefacts/Release
          mkdir -p dist
          cp -R "$R/VST3/Plosivore.vst3" dist/
          if [ -d "$R/AU" ]; then cp -R "$R/AU/Plosivore.component" dist/; fi
          cp -R "$R/Standalone/"* dist/
          cp README.md dist/
          cd dist && cmake -E tar cf "../Plosivore-${{ matrix.name }}.zip" --format=zip .

      - uses: actions/upload-artifact@v4
        with:
          name: Plosivore-${{ matrix.name }}
          path: dist

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Plosivore-${{ matrix.name }}.zip
            installer/*.dmg
            installer/*.pkg
